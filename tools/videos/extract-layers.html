<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:720px;height:450px;overflow:hidden;background:#131418;font:14px Inter,sans-serif;color:#ececea}
#cap{position:absolute;left:24px;right:24px;top:18px;height:56px;display:flex;align-items:center;gap:12px}
#num{width:34px;height:34px;border-radius:9px;background:#2d8ceb;color:#fff;font:700 18px Inter;display:grid;place-items:center;flex:none}
#txt{font:600 19px Inter;letter-spacing:-.01em}
#sub{position:absolute;left:24px;bottom:16px;font:500 13px Inter;color:#9a9ba3}
#tag{position:absolute;right:24px;bottom:14px;font:600 12px Inter;color:#6b6c75}
.win{position:absolute;left:24px;top:86px;width:672px;height:322px;background:#1c1d22;border:1px solid #2c2d34;border-radius:12px;overflow:hidden}
.bar{height:30px;background:#24252b;border-bottom:1px solid #2c2d34;display:flex;align-items:center;padding:0 12px;gap:8px;font:600 12px Inter;color:#9a9ba3}
.ruler{position:absolute;left:250px;right:0;top:30px;height:22px;border-bottom:1px solid #2c2d34;font:11px Inter;color:#6b6c75}
.ruler span{position:absolute;top:4px}
.row{position:absolute;left:0;right:0;height:34px;display:flex;align-items:center;border-bottom:1px solid #24252b;transition:none}
.row .eye{width:28px;text-align:center;color:#9a9ba3;font-size:12px}
.row .lab{width:12px;height:12px;border-radius:3px;margin:0 10px 0 4px}
.row .nm{width:190px;font:500 13px Inter;white-space:nowrap;overflow:hidden}
.row .bar2{position:absolute;height:20px;border-radius:4px;top:7px}
.sel{background:#2d8ceb22}
.cursor{position:absolute;width:18px;height:24px;pointer-events:none}
.menu{position:absolute;background:#2a2b31;border:1px solid #3a3b42;border-radius:8px;padding:6px 0;font:500 13px Inter;box-shadow:0 10px 30px #0008}
.menu div{padding:6px 16px;white-space:nowrap}
.menu .hi{background:#2d8ceb;color:#fff}
.cti{position:absolute;top:30px;bottom:0;width:2px;background:#2d8ceb}
</style></head><body>
<div id="cap"><div id="num">1</div><div id="txt"></div></div>
<div class="win" id="win">
  <div class="bar">Composition: Ad_9x16 ▾</div>
  <div class="ruler"><span style="left:8px">0s</span><span style="left:105px">2s</span><span style="left:202px">4s</span><span style="left:299px">6s</span><span style="left:396px">8s</span></div>
  <div class="cti" style="left:400px"></div>
  <div id="rows"></div>
</div>
<div id="menu" class="menu"></div>
<svg id="cur" class="cursor" viewBox="0 0 18 24"><path d="M1 1 L1 19 L6 14 L9.5 22 L12.5 20.7 L9 13 L16 13 Z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg>
<div id="sub"></div><div id="tag">Extract Layers · Hyperframes</div>
<script>
const ease=t=>t<0?0:t>1?1:t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const seg=(t,a,b)=>ease((t-a)/(b-a));
const L=(a,b,k)=>a+(b-a)*k;
// x for timeline seconds
const X=s=>250+8+s*48.5;
const base=[
 {nm:'Text: Виграй 500$',c:'#e3c33c',a:.5,b:6},
 {nm:'Precomp: Phone screen',c:'#a99be0',a:1,b:7.5,pre:1},
 {nm:'Background.mp4',c:'#4fc6c6',a:0,b:8.5},
];
const inner=[
 {nm:'Phone screen [transform]',c:'#7d7f88',a:1,b:7.5,ctrl:1},
 {nm:'UI_overlay.png',c:'#e57fb6',a:1.2,b:7.5},
 {nm:'Gameplay.mp4',c:'#7fcfa0',a:1,b:7.5},
 {nm:'Phone_frame.png',c:'#e9a56b',a:1,b:7.5},
];
const caps=[[0,1,'Виділи прекомп-шар у композиції'],[3.2,2,'File › Scripts › ExtractLayers.jsx'],[5.6,3,'Шари прекомпу — прямо в композиції'],[9.6,4,'Оригінал вимкнено, не видалено']];
const subs=[[0,'Можна кілька прекомпів одразу'],[3.2,'Або поклади скрипт у папку Scripts'],[5.6,'Положення, трансформації, парентинг і таймінг — без змін'],[9.6,'Усе скасовується одним Ctrl+Z']];
function row(r,y,o={}){
  const op=o.op??1,sel=o.sel?' sel':'';
  return `<div class="row${sel}" style="top:${y}px;opacity:${op};transform:translateX(${o.dx||0}px)">
   <div class="eye">${o.off?'○':'●'}</div><div class="lab" style="background:${r.c}"></div>
   <div class="nm" style="${o.off?'color:#6b6c75;text-decoration:line-through':''}">${r.pre?'▣ ':r.ctrl?'◇ ':''}${r.nm}</div>
   <div class="bar2" style="left:${X(r.a)}px;width:${X(r.b)-X(r.a)}px;background:${r.c};opacity:${o.off?.18:.55}"></div></div>`;
}
window.render=function(t){
  t=t%12;
  const ci=caps.filter(c=>t>=c[0]).pop();
  document.getElementById('num').textContent=ci[1];
  document.getElementById('txt').textContent=ci[2];
  document.getElementById('sub').textContent=subs.filter(c=>t>=c[0]).pop()[1];
  const capOp=Math.min(1,...caps.map(c=>Math.abs(t-c[0])<.25?Math.abs(t-c[0])/.25:1));
  document.getElementById('cap').style.opacity=t<.25?t/.25:capOp;
  // rows
  const top=52, h=34;
  const k=seg(t,5.6,7.2); // extraction progress
  let html='';
  // Text row
  html+=row(base[0],top);
  // inner rows appear between Text and Precomp
  inner.forEach((r,i)=>{const kk=seg(t,5.6+i*.18,6.8+i*.18);
    if(kk>0)html+=row(r,top+h+i*h*k,{op:kk,dx:(1-kk)*-30});});
  const pY=top+h+inner.length*h*k;
  const selected=t>1.2&&t<5.6;
  html+=row(base[1],pY,{sel:selected||(t>9.6&&t<11.4&&Math.sin(t*6)>0),off:t>7.2});
  html+=row(base[2],pY+h);
  document.getElementById('rows').innerHTML=html;
  // cursor path
  const cur=document.getElementById('cur');
  let cx,cy;
  const p1=[520,330],p2=[150,86+52+34+17+4],p3=[90,128],p4=[150,110];
  if(t<1.1){const k=seg(t,.2,1.1);cx=L(p1[0],p2[0],k);cy=L(p1[1],p2[1],k)}
  else if(t<3.2){cx=p2[0];cy=p2[1]}
  else if(t<3.8){const k=seg(t,3.2,3.8);cx=L(p2[0],p3[0],k);cy=L(p2[1],p3[1],k)}
  else if(t<5.2){const k=seg(t,3.8,5.0);cx=L(p3[0],230,k);cy=L(p3[1],190,k)}
  else {const k=seg(t,5.3,6.5);cx=L(230,560,k);cy=L(190,400,k)}
  const click=(t>1.1&&t<1.3)||(t>5.0&&t<5.2);
  cur.style.left=cx+'px';cur.style.top=cy+'px';cur.style.transform=`scale(${click?.85:1})`;
  // menu
  const m=document.getElementById('menu');
  if(t>3.7&&t<5.4){m.style.display='block';m.style.left='60px';m.style.top='118px';
    const hi=t>4.4?2:t>4.0?1:0;
    m.innerHTML=['File','Scripts ›','ExtractLayers.jsx'].map((s,i)=>`<div class="${i===hi?'hi':''}" style="${i===2&&t<4.0?'opacity:0':''};${i===2?'padding-left:28px':''}">${s}</div>`).join('');
    m.style.opacity=t>5.2?Math.max(0,(5.4-t)/.2):1}
  else m.style.display='none';
  // fade at loop end
  document.body.style.opacity=t>11.6?(12-t)/.4:t<.15?.6+t/.15*.4:1;
};
render(0);
</script></body></html>
